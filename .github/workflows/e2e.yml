name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for all three cores (blank = pins from .env.example)"
        required: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i \
            -e 's/change-me-to-a-jwt-signing-key-at-least-32-chars/compose-e2e-jwt-signing-key-32chars-min/' \
            -e 's/your-username/e2e/' \
            -e 's/your-password/e2e/' \
            .env
          TAG="${{ inputs.tag }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then TAG=edge; fi
          if [ -n "$TAG" ]; then
            sed -i -E "s/^(OXYKIT_(RENDER|MAIL|FLOW)_TAG)=.*/\1=${TAG}/" .env
          fi
          grep '^OXYKIT_' .env

      - name: Golden path (Flow → Render → file + Mail accept)
        env:
          START_COMPOSE: "1"
          RUN_MAIL: "1"
          POLL_SECONDS: "120"
        run: ./scripts/e2e.sh

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true
